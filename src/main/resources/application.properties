spring.application.name=kz
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/avtozvuk}
spring.datasource.username=${DB_USER:avtozvuk}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,image/svg+xml
